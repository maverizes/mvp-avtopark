<!doctype html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>JoyBor — operator paneli</title>
  <meta name="theme-color" content="#141726">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>

<body>
  <!-- Kirish -->
  <main class="login" id="login-view" hidden>
    <form class="card login__card" id="login-form" novalidate>
      <p class="brand">JoyBor</p>
      <h1 class="login__title">Operator paneli</h1>
      <div class="field">
        <label for="lg-pass">Parol</label>
        <input id="lg-pass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="status status--warn" id="login-status" role="alert"></p>
      <button class="btn btn--lg btn--block" type="submit">Kirish</button>
    </form>
  </main>

  <!-- Panel -->
  <div id="app-view" hidden>
    <header class="header">
      <div class="wrap header__row">
        <a class="brand" href="/">JoyBor</a>
        <span class="admin-tag">Operator</span>
        <div class="admin-tabs" role="tablist" aria-label="Bo‘limlar">
          <button class="admin-tab" type="button" role="tab" id="tab-bookings" aria-controls="panel-bookings" aria-selected="true">
            Bronlar <span class="count" id="pending-count" hidden></span>
          </button>
          <button class="admin-tab" type="button" role="tab" id="tab-lots" aria-controls="panel-lots" aria-selected="false" tabindex="-1">Turargohlar</button>
          <button class="admin-tab" type="button" role="tab" id="tab-stats" aria-controls="panel-stats" aria-selected="false" tabindex="-1">Statistika</button>
        </div>
        <button class="btn btn--ghost btn--sm admin-logout" type="button" id="logout">Chiqish</button>
      </div>
    </header>

    <main class="wrap admin-main">
      <section id="panel-bookings" role="tabpanel" aria-labelledby="tab-bookings">
        <div class="admin-bar">
          <div class="filters" id="bk-filters" role="group" aria-label="Holat bo‘yicha"></div>
          <p class="muted small" id="bk-updated"></p>
        </div>
        <div class="abk-list" id="bk-list" aria-live="polite"></div>
      </section>

      <section id="panel-lots" role="tabpanel" aria-labelledby="tab-lots" hidden>
        <div class="lots-admin">
          <div>
            <button class="btn btn--block" type="button" id="lot-new">+ Yangi turargoh</button>
            <ul class="lot-list" id="lot-list"></ul>
          </div>
          <div class="card lot-edit" id="lot-edit"></div>
        </div>
      </section>

      <section id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" hidden>
        <div id="stats"></div>
      </section>
    </main>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <script type="module" src="/js/admin.js"></script>
</body>

</html>
