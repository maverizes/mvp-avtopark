# Serverga joylash: ilova + Caddy (avtomatik HTTPS sertifikat).
# Ishga tushirish: cp .env.example .env && (to'ldiring) && docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/joybor.db
      TRUST_PROXY: "true"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
